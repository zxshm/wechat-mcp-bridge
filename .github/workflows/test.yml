name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wechat-core-offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: wechat-core-offline/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y python3-pil
      - run: npm ci --ignore-scripts
      - run: npm test
